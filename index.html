  <style>
    :root {

    html, body {

      background: var(--bg);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    h1, h2, h3, .rb, .brand h1, .row-name, .story-name, .sheet header h2, .modal header h2 {
      font-family: "Rubik", "Assistant", sans-serif;

    button, input, textarea, select { font-family: inherit; }

    .app {

      height: 100%;

      min-height: 100dvh;
      max-width: 100%;

    }

    .app-header, .feed-section, .sidebar, .modal, .lock-screen, .toast, .sheet, .header-menu {

    .app-header {
      flex-shrink: 0;

      align-items: center;
      justify-content: space-between;

    }

    .brand {

    .brand-mark {

      height: 44px;

      color: #fff;
      display: grid;
      place-items: center;

    .brand h1 {

    .brand p {
      font-size: 13.5px;

    }

    .header-actions {

    .btn {

      background: var(--surface);
      color: var(--ink);
      border-radius: 14px;
      padding: 0 16px;
      min-height: 44px;
      font-size: 15px;

    .btn-primary {

    }

    .btn-danger {

    .btn-map-toggle {

    .icon-btn {

      height: 44px;

      color: var(--ink);

    .sync-pill::before {

      height: 8px;
      border-radius: 50%;
      background: #22C55E;
      box-shadow: 0 0 0 3px #DCFCE7;

    .sync-pill.warn::before { background: #F59E0B; box-shadow: 0 0 0 3px #FEF3C7; }
    .sync-pill.danger { background: var(--danger-soft); color: var(--danger); }
    .sync-pill.danger::before { background: var(--danger); box-shadow: 0 0 0 3px #FECACA; }
    .sync-pill[hidden] { display: none !important; }

    .feed-section {

      border-bottom: 1px solid var(--line);
      padding: 14px 20px 16px;

    .feed-head {

      margin-bottom: 10px;

    .feed-title { font-family: "Rubik", sans-serif; font-size: 17px; font-weight: 700; }
    .feed-sub { font-size: 13.5px; color: var(--muted); font-weight: 500; }

    .feed-track::-webkit-scrollbar { display: none; }
    .story-card {

      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      padding: 0;

    }
    .story-card.fresh .story-ring {
      background: conic-gradient(var(--primary), #5EEAD4, var(--primary));
    }
    .story-card:hover .story-ring { transform: translateY(-1px); }
    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;

      font-size: 20px;

    .story-name { font-size: 13px; font-weight: 700; line-height: 1.2; }

    .app-body {

    .sidebar {

    .sidebar-top {

      flex-shrink: 0;

    .search-wrap { position: relative; }

    .color-chip {

      border: 1.5px solid var(--line);

      height: 10px;
      border-radius: 50%;

      flex-shrink: 0;

    .color-chip { opacity: 0.45; }
    .color-chip.active {
      opacity: 1;
      transform: none;
      border-color: var(--ink);
      background: #fff;
      color: var(--ink);
    }

    .legend {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 8px 12px;
    }
    .legend summary {
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      list-style: none;
    }
    .legend summary::-webkit-details-marker { display: none; }
    .legend-grid { display: grid; gap: 6px; margin-top: 8px; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-swatch {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.12);

    .legend-row input {
      flex: 1;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13.5px;
      background: #fff;
    }

    .list-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 20px 10px;
      background: transparent;
      border-bottom: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
    }
    .list-toolbar .count-num { color: var(--ink); font-family: "Rubik", sans-serif; font-weight: 700; font-size: 16px; }

    .list-wrap {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 4px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 36px 20px;
      font-size: 14.5px;
      line-height: 1.6;
    }

    .customer-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      min-height: 76px;
      border: 1.5px solid transparent;
      border-bottom: 1.5px solid transparent;
      cursor: pointer;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: border-color 0.15s;
      grid-template-columns: none;

    .customer-row:hover { border-color: #BFE3DE; background: #fff; }
    .customer-row.selected {

      box-shadow: var(--shadow), 0 0 0 2px var(--primary);
      border-color: var(--primary);
    }
    .customer-row.placing { background: var(--warn-soft); }

    .row-check { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; margin: 0; }

    .row-ava {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-family: "Rubik", sans-serif;
      font-weight: 700;
      font-size: 17px;
      border: none;
      cursor: pointer;
      box-shadow: none;
      padding: 0;
    }
    .row-ava:hover { outline: 2px solid rgba(15, 118, 110, 0.35); outline-offset: 1px; }

    .row-main { min-width: 0; flex: 1; }
    .row-name {
      font-weight: 600;
      font-size: 17px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-addr, .row-meta {
      font-size: 14.5px;
      color: var(--muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .row-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      font-size: 13px;
      padding: 2px 9px;
      border-radius: 999px;
    }
    .row-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .call-btn {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      border: 0;
      text-decoration: none;
      padding: 0;
    }
    .call-btn:hover { background: #d7efec; }
    .call-btn svg { width: 22px; height: 22px; }

    .sidebar-footer {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      padding: 10px 16px 14px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .map-column {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
    }
    .map-column .map-pane, .map-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: auto;
      position: relative;
      background: transparent;
      padding: 16px;
    }
    #map {
      height: 100%;
      width: 100%;
      border-radius: 22px;
      box-shadow: var(--shadow);
      direction: ltr;
      overflow: hidden;
      z-index: 1;
    }

    .app-body.map-hidden {
      grid-template-columns: 1fr;
    }
    .app-body.map-hidden .map-column { display: none; }
    .app-body.map-hidden .sidebar {
      width: 100%;
      max-width: 100%;
      min-height: 0;
      height: auto;
      flex: 1;
      border-left: none;
    }

    }
    .app-body.map-hidden #customerList .empty-state,
    .app-body.map-hidden #customerList .load-more-wrap {
      grid-column: 1 / -1;
    }

    .map-hint {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #0F1F1E;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow);
      display: none;
      white-space: nowrap;
      max-width: calc(100% - 48px);
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
    }
    .map-hint.visible { display: block; }

    .leaflet-popup-content { direction: rtl; text-align: right; margin: 10px 12px; }
    .popup-title { font-family: "Rubik", sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .popup-line { font-size: 13px; color: #445; margin: 2px 0; }
    .popup-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .popup-line a.popup-phone, a.detail-phone {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    .popup-line a.popup-phone:hover, a.detail-phone:hover { text-decoration: underline; }

    .load-more-wrap { padding: 8px 0 16px; display: flex; justify-content: center; }

    /* FAB */
    .fab {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 600;
      height: 60px;
      padding: 0 24px 0 22px;
      border-radius: 20px;
      background: var(--primary);
      border: 0;
      color: #fff;
      font-family: "Rubik", sans-serif;
      font-weight: 700;
      font-size: 17px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(15, 118, 110, 0.4);
      cursor: pointer;
    }
    .fab:hover { background: var(--primary-dark); }

    /* Lock */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #E6F4F2, #F4F7F7 50%, #fff);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;

async function sha256hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function (b) {
    return b.toString(16).padStart(2, "0");
  }).join("");
}

}

function formatHebrewDate(ms) {
  const t = toMillis(ms);
  if (!t) return "";
  const d = new Date(t);
  if (!isFinite(d.getTime())) return "";
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const startThat = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((startToday - startThat) / 86400000);
  const timePart = new Intl.DateTimeFormat("he-IL", { hour: "2-digit", minute: "2-digit" }).format(d);
  if (days === 0) return "היום, " + timePart;
  if (days === 1) return "אתמול, " + timePart;
  if (days > 1 && days < 7) {
    const weekday = new Intl.DateTimeFormat("he-IL", { weekday: "long" }).format(d);
    return weekday + ", " + timePart;
  }
  return new Intl.DateTimeFormat("he-IL", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(d);
}

function initialOf(name) {
  const s = String(name || "").trim();
  if (!s) return "?";
  const words = s.split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0].charAt(0) + words[1].charAt(0));
  return s.slice(0, Math.min(2, s.length));
}

function colorTint(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length !== 6) return "rgba(15,118,110,0.12)";
  const n = parseInt(h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return "rgba(" + r + "," + g + "," + b + ",0.14)";
}

function toMillis(value) {
  if (value == null || value === "") return null;
  if (typeof value === "number" && isFinite(value)) return value;
  if (typeof value.toMillis === "function") return value.toMillis();
  if (typeof value.seconds === "number") {
    return value.seconds * 1000 + Math.floor((value.nanoseconds || 0) / 1e6);
  }
  const parsed = Date.parse(value);
  return isFinite(parsed) ? parsed : null;
}

function normalizeCustomer(c, fallbackId) {
  if (!c || !c.name) return null;
  const latRaw = c.lat;
  const lngRaw = c.lng;
  const lat = typeof latRaw === "number" ? latRaw : (latRaw != null && latRaw !== "" ? parseFloat(latRaw) : null);
  const lng = typeof lngRaw === "number" ? lngRaw : (lngRaw != null && lngRaw !== "" ? parseFloat(lngRaw) : null);
  return {
    id: c.id || fallbackId || uid(),
    name: String(c.name),
    address: c.address ? String(c.address) : "",
    phone: c.phone ? String(c.phone) : "",
    notes: (c.notes || c.description) ? String(c.notes || c.description) : "",
    color: COLOR_IDS.indexOf(c.color) !== -1 ? c.color : "gray",
    lat: lat != null && isFinite(lat) ? lat : null,
    lng: lng != null && isFinite(lng) ? lng : null,
    createdAt: toMillis(c.createdAt) || 0,
    updatedAt: toMillis(c.updatedAt) || 0,
    updatedBy: c.updatedBy ? String(c.updatedBy) : ""
  };
}

function sortCustomers(list) {

    return String(a.name || "").localeCompare(String(b.name || ""), "he");
  });
  return list;
}

function loadState() {

      const rawList = data.customers;
      const hadDates = rawList.some(function (c) { return c && (c.createdAt || c.updatedAt); });
      const list = rawList.map(function (c) {
        return normalizeCustomer(c, c && c.id);
      }).filter(Boolean);
      state.customers = hadDates ? sortCustomers(list) : list;
    }
    if (data.legend && typeof data.legend === "object") state.legend = data.legend;
  } catch (err) {
    console.warn("loadState failed", err);
  }
}

function setSyncPill(text, tone) {

function enqueuePersist(work) {

    console.warn("cloud persist failed", err);
    toast("השמירה לענן נכשלה. הנתונים נשמרו במכשיר, ונכסה שוב בעדכון הבא.");
  });
  return persistQueue;
}

function persistCustomer(c) {
  mirrorLocal();
  if (!canWriteCloud() || !c || !c.id) return Promise.resolve();
  const rec = c;
  return enqueuePersist(function () {
    return setDoc(doc(firebaseDb, CUSTOMERS_COLLECTION, rec.id), customerToDoc(rec), { merge: true });
  });
}

function persistLegend() {

}

function persistDelete(id) {

}

async function commitBatches(ops) {
  if (!canWriteCloud()) return;
  for (let i = 0; i < ops.length; i += BATCH_LIMIT) {
    const chunk = ops.slice(i, i + BATCH_LIMIT);
    const batch = writeBatch(firebaseDb);
    chunk.forEach(function (op) {
      if (op.type === "set") batch.set(op.ref, op.data, { merge: true });
      else if (op.type === "delete") batch.delete(op.ref);
    });
    await batch.commit();
  }
}

function replaceAllInCloud(previousIds) {
  if (!canWriteCloud()) return Promise.resolve();
  const prev = new Set(previousIds || []);
  const ops = [];
  state.customers.forEach(function (c) {
    ops.push({
      type: "set",
      ref: doc(firebaseDb, CUSTOMERS_COLLECTION, c.id),
      data: customerToDoc(c)
    });
    prev.delete(c.id);
  });
  prev.forEach(function (id) {
    ops.push({ type: "delete", ref: doc(firebaseDb, CUSTOMERS_COLLECTION, id) });
  });
  ops.push({
    type: "set",
    ref: doc(firebaseDb, SETTINGS_COLLECTION, LEGEND_DOC_ID),
    data: {
      labels: state.legend || {},
      updatedAt: serverTimestamp(),
      updatedBy: currentEmail()
    }
  });
  return enqueuePersist(function () { return commitBatches(ops); });
}

function docToCustomer(id, data) {
  return normalizeCustomer(Object.assign({}, data, { id: id }), id);
}

function applyCustomersSnapshot(snap) {
  applyingRemote = true;
  try {
    const list = [];
    snap.forEach(function (item) {
      const rec = docToCustomer(item.id, item.data());
      if (rec) list.push(rec);
    });
    state.customers = sortCustomers(list);
    const still = new Set(state.customers.map(function (c) { return c.id; }));
    state.routeIds = state.routeIds.filter(function (id) { return still.has(id); });
    if (state.selectedId && !still.has(state.selectedId)) state.selectedId = null;
    if (state.placingId && !still.has(state.placingId)) exitPlaceMode();
    mirrorLocal();
    renderAll();
    updateSyncPill(snap.metadata);
  } finally {
    applyingRemote = false;
  }
}

function applyLegendSnapshot(snap) {
  if (!snap.exists()) return;
  const data = snap.data() || {};
  const labels = data.labels && typeof data.labels === "object" ? data.labels : data;
  if (!labels || typeof labels !== "object") return;
  applyingRemote = true;
  try {
    const next = {};
    Object.keys(labels).forEach(function (k) {
      if (COLOR_IDS.indexOf(k) !== -1 && typeof labels[k] === "string") next[k] = labels[k];
    });
    state.legend = next;
    mirrorLocal();
    renderLegend();
    renderColorFilters();
  } finally {
    applyingRemote = false;
  }
}

function stopCloudListeners() {
  if (unsubCustomers) { unsubCustomers(); unsubCustomers = null; }
  if (unsubLegend) { unsubLegend(); unsubLegend = null; }
  firstCustomersSnap = null;
}

function startCloudListeners() {
  stopCloudListeners();
  if (!canWriteCloud() && !(cloudReady && firebaseDb && currentUser)) return;
  firstCustomersSnap = new Promise(function (resolve, reject) {
    let settled = false;
    unsubCustomers = onSnapshot(
      collection(firebaseDb, CUSTOMERS_COLLECTION),
      { includeMetadataChanges: true },
      function (snap) {
        applyCustomersSnapshot(snap);
        if (!settled && !snap.metadata.fromCache) {
          settled = true;
          resolve(snap);
        } else if (!settled && snap.metadata.fromCache) {
          // Resolve on the first cache snapshot too, so offline sign-in can proceed.
          // A later server snapshot will still refresh the list.
          settled = true;
          resolve(snap);
        }
      },
      function (err) {
        console.warn("customers onSnapshot failed", err);
        setSyncPill("אין הרשאה לענן או שהחיבור נכשל", "danger");
        toast("לא ניתן לטעון את הלקוחות מהענן. בדקו את כללי האבטחה ואת החיבור.");
        if (!settled) {
          settled = true;
          reject(err);
        }
      }
    );
  });
  unsubLegend = onSnapshot(
    doc(firebaseDb, SETTINGS_COLLECTION, LEGEND_DOC_ID),
    function (snap) { applyLegendSnapshot(snap); },
    function (err) { console.warn("legend onSnapshot failed", err); }
  );
}

function capturePendingLegacy() {
  if (localStorage.getItem(MIGRATION_KEY) === "1") {
    pendingLegacyMigration = null;
    return;
  }
  // Snapshot the pre-cloud localStorage now, before a live listener
  // overwrites the mirror with cloud data.
  pendingLegacyMigration = readLegacyLocalCustomers();
}

async function maybeMigrateLocalCustomers() {
  if (localStorage.getItem(MIGRATION_KEY) === "1") return;
  if (!canWriteCloud()) return;
  try {
    if (firstCustomersSnap) await firstCustomersSnap;
  } catch (err) {
    return;
  }
  const legacy = pendingLegacyMigration || readLegacyLocalCustomers();
  if (!legacy.customers.length) {
    localStorage.setItem(MIGRATION_KEY, "1");
    return;
  }
  const ok = confirm(
    "נמצאו " + legacy.customers.length +
    " לקוחות ששמורים במכשיר זה מהאפליקציה הקודמת.\n\n" +
    "להעלות אותם לענן כדי שיופיעו גם במכשירים האחרים?\n" +
    "לקוחות שכבר קיימים בענן (אותו שם ואותה כתובת) ידולגו."
  );
  if (!ok) {
    localStorage.setItem(MIGRATION_KEY, "1");
    toast("הלקוחות המקומיים לא הועלו. אפשר לייבא אותם אחר כך מקובץ JSON.");
    return;
  }
  const existingKeys = new Set(state.customers.map(customerDupKey));
  const existingIds = new Set(state.customers.map(function (c) { return c.id; }));
  let uploaded = 0;
  let skipped = 0;
  const ops = [];
  legacy.customers.forEach(function (c) {
    if (existingKeys.has(customerDupKey(c))) {
      skipped += 1;
      return;
    }
    const id = c.id && !existingIds.has(c.id) ? c.id : uid();
    const rec = Object.assign({}, c, { id: id, updatedBy: currentEmail(), updatedAt: Date.now() });
    existingKeys.add(customerDupKey(rec));
    existingIds.add(id);
    state.customers.unshift(rec);
    ops.push({
      type: "set",
      ref: doc(firebaseDb, CUSTOMERS_COLLECTION, rec.id),
      data: customerToDoc(rec)
    });
    uploaded += 1;
  });
  const legendWasEmpty = !Object.keys(state.legend || {}).length;
  if (legendWasEmpty && legacy.legend && Object.keys(legacy.legend).length) {
    state.legend = legacy.legend;
    ops.push({
      type: "set",
      ref: doc(firebaseDb, SETTINGS_COLLECTION, LEGEND_DOC_ID),
      data: {
        labels: state.legend,
        updatedAt: serverTimestamp(),
        updatedBy: currentEmail()
      }
    });
  }
  sortCustomers(state.customers);
  mirrorLocal();
  renderAll();
  if (ops.length) {
    try {
      await enqueuePersist(function () { return commitBatches(ops); });
    } catch (err) {
      console.warn("migration upload failed", err);
      toast("ההעלאה לענן נכשלה חלקית. אפשר לנסות שוב דרך ייצוא וייבוא JSON.");
      return;
    }
  }
  localStorage.setItem(MIGRATION_KEY, "1");
  toast(
    uploaded
      ? ("הועלו " + uploaded + " לקוחות לענן" + (skipped ? (" (דולגו " + skipped + " כפולים)") : ""))
      : (skipped ? "כל הלקוחות המקומיים כבר קיימים בענן" : "לא נמצאו לקוחות להעלאה")
  );
}

  const map = {

    "auth/user-disabled": "החשבון הושבת. פנו למנהל המערכת",
    "auth/user-not-found": "לא נמצא משתמש עם האימייל הזה",
    "auth/wrong-password": "סיסמה שגויה",
    "auth/invalid-credential": "אימייל או סיסמה שגויים",
    "auth/invalid-login-credentials": "אימייל או סיסמה שגויים",
    "auth/too-many-requests": "יותר מדי ניסיונות. נסו שוב מאוחר יותר",
    "auth/network-request-failed": "אין חיבור לרשת. בדקו את החיבור ונסו שוב",
    "auth/missing-password": "יש להזין סיסמה",
    "auth/missing-email": "יש להזין כתובת אימייל",
    "auth/invalid-api-key": "הגדרות Firebase חסרות או שגויות",
    "auth/unauthorized-domain": "הדומיין הזה לא מורשה ב-Firebase. יש להוסיף אותו ב-Authorized domains",
    "auth/operation-not-allowed": "כניסה באימייל וסיסמה לא הופעלה בקונסולת Firebase",

function showLock() {
  $("lockScreen").classList.remove("hidden");
  const chip = $("userChip");
  if (chip) chip.hidden = true;
  const pass = $("lockPassword");
  if (pass) pass.focus();
}

function showApp() {
  $("lockScreen").classList.add("hidden");
  const chip = $("userChip");
  if (chip) chip.hidden = true;
  setSyncPill("");
  if (!mapReady) initMap();
  else if (map) setTimeout(function () { map.invalidateSize(); }, 80);
}

async function loadFirebaseSdk() {
  const appMod = await import(FIREBASE_APP_SDK);
  const authMod = await import(FIREBASE_AUTH_SDK);
  const fsMod = await import(FIREBASE_FIRESTORE_SDK);
  initializeApp = appMod.initializeApp;
  getAuth = authMod.getAuth;
  onAuthStateChanged = authMod.onAuthStateChanged;
  signInWithEmailAndPassword = authMod.signInWithEmailAndPassword;
  signOut = authMod.signOut;
  sendPasswordResetEmail = authMod.sendPasswordResetEmail;
  initializeFirestore = fsMod.initializeFirestore;
  persistentLocalCache = fsMod.persistentLocalCache;
  persistentMultipleTabManager = fsMod.persistentMultipleTabManager;
  memoryLocalCache = fsMod.memoryLocalCache;
  collection = fsMod.collection;
  doc = fsMod.doc;
  setDoc = fsMod.setDoc;
  deleteDoc = fsMod.deleteDoc;
  onSnapshot = fsMod.onSnapshot;
  serverTimestamp = fsMod.serverTimestamp;
  writeBatch = fsMod.writeBatch;
}

async function initFirebaseOrLocalMessage() {
  cloudConfigured = isFirebaseConfigured(FIREBASE_CONFIG);
  const banner = $("cloudSetupBanner");
  const localBtn = $("btnLocalOnly");
  const signInBtn = $("btnSignIn");
  const forgotBtn = $("btnForgot");
  const emailInput = $("lockEmail");
  const passInput = $("lockPassword");

  if (!cloudConfigured) {
    banner.classList.remove("hidden");
    banner.textContent =
      "הענן עדיין לא הוגדר. כדי להפעיל סנכרון בין המכשירים, יש להדביק את הגדרות Firebase בקובץ (ראה SETUP-HE.md). בינתיים אפשר להמשיך במצב מקומי בלבד — הרשימה תישמר רק בדפדפן הזה.";
    localBtn.hidden = false;
    signInBtn.disabled = true;
    forgotBtn.disabled = true;
    emailInput.disabled = true;
    passInput.disabled = true;
    return;
  }

  banner.classList.add("hidden");
  banner.textContent = "";
  localBtn.hidden = true;
  signInBtn.disabled = false;
  forgotBtn.disabled = false;
  emailInput.disabled = false;
  passInput.disabled = false;

  try {
    await loadFirebaseSdk();
    firebaseApp = initializeApp(FIREBASE_CONFIG);
    try {
      firebaseDb = initializeFirestore(firebaseApp, {
        localCache: persistentLocalCache({
          tabManager: persistentMultipleTabManager()
        })
      });
    } catch (persistErr) {
      console.warn("persistent cache failed, falling back to memory cache", persistErr);
      try {
        firebaseDb = initializeFirestore(firebaseApp, {
          localCache: memoryLocalCache()
        });
      } catch (memErr) {
        console.warn("memory cache init also failed", memErr);
        throw persistErr;
      }
      toast("שמירה לא מקוונת מלאה אינה זמינה בדפדפן זה, אך הסנכרון בענן פעיל");
    }
    firebaseAuth = getAuth(firebaseApp);
    cloudReady = true;
    onAuthStateChanged(firebaseAuth, onAuthChanged);
  } catch (err) {
    console.warn("Firebase init failed", err);
    cloudReady = false;
    banner.classList.remove("hidden");
    banner.textContent =
      "לא ניתן להתחבר לענן. בדקו את הגדרות Firebase. אפשר להמשיך בינתיים במצב מקומי בלבד.";
    localBtn.hidden = false;
    signInBtn.disabled = true;
    forgotBtn.disabled = true;
  }
}

async function onAuthChanged(user) {
  currentUser = user || null;
  if (!user) {
    stopCloudListeners();
    showLock();
    updateSyncPill();
    return;
  }
  localOnlyMode = false;
  showApp();
  startCloudListeners();
  try {
    await maybeMigrateLocalCustomers();
  } catch (err) {
    console.warn("migration failed", err);
  }
}

async function onLockSubmit(ev) {
  ev.preventDefault();
  const input = $("lockPassword");
  const error = $("lockError");
  error.textContent = "";
  const ok = await tryUnlock(input.value);
  if (ok) {
    try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (err) {}
    input.value = "";
    showApp();
  } else {
    error.textContent = "סיסמה שגויה";
    input.focus();
    input.select();
  }
}

async function onForgotPassword() {
  const error = $("lockError");
  error.textContent = "";
  if (!cloudConfigured || !firebaseAuth) {
    error.textContent = "הענן עדיין לא הוגדר";
    return;
  }
  const email = $("lockEmail").value.trim();
  if (!email) {
    error.textContent = "יש להזין כתובת אימייל כדי לאפס את הסיסמה";
    $("lockEmail").focus();
    return;
  }
  try {
    await sendPasswordResetEmail(firebaseAuth, email);
    toast("נשלח מייל לאיפוס הסיסמה, אם החשבון קיים. בדקו גם בתיקיית הספאם.");
  } catch (err) {
    console.warn("password reset failed", err);
    error.textContent = hebrewAuthError(err);
  }
}

function enterLocalOnlyMode() {
  localOnlyMode = true;
  currentUser = null;
  stopCloudListeners();
  loadState();
  renderLegend();
  renderAll();
  showApp();
  toast("מצב מקומי בלבד — הרשימה נשמרת רק בדפדפן הזה");
}

function onSignOut() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (err) {}
  $("lockError").textContent = "";
  const pass = $("lockPassword");
  if (pass) pass.value = "";
  showLock();
}

/* ---------- Map visibility ---------- */
function isMapVisibleStored() {
  try {
    // Choice is session-only. Ignore any older localStorage "visible" flag
    // so a returning device still starts with the map closed.
    const v = sessionStorage.getItem(MAP_VISIBLE_KEY);
    if (v === "1") return true;
    if (v === "0") return false;
  } catch (err) {}
  return false;
}

function applyMapVisibility(visible, opts) {
  opts = opts || {};
  state.mapVisible = !!visible;
  const body = document.querySelector(".app-body");
  if (body) body.classList.toggle("map-hidden", !state.mapVisible);
  const app = $("appShell");
  if (app) app.classList.toggle("map-open", state.mapVisible);
  document.body.classList.toggle("map-open", state.mapVisible);
  const label = state.mapVisible ? "סגור מפה" : "פתח מפה";
  ["btnToggleMap", "btnToggleMapHeader"].forEach(function (id) {
    const btn = $(id);
    if (!btn) return;
    btn.textContent = label;
    btn.setAttribute("aria-pressed", state.mapVisible ? "true" : "false");
    btn.setAttribute("aria-expanded", state.mapVisible ? "true" : "false");
    btn.title = label;
  });
  const navMap = $("btnNavMap");
  if (navMap) {
    navMap.setAttribute("aria-pressed", state.mapVisible ? "true" : "false");
    const lab = navMap.querySelector(".bottom-nav-map-label");
    if (lab) lab.textContent = state.mapVisible ? "סגור מפה" : "מפה";
    navMap.setAttribute("aria-label", label);
  }
  const navList = $("btnNavList");
  if (navList) navList.setAttribute("aria-current", state.mapVisible ? "false" : "page");
  if (!opts.skipStore) {
    try { sessionStorage.setItem(MAP_VISIBLE_KEY, state.mapVisible ? "1" : "0"); } catch (err) {}
  }
  try { localStorage.removeItem(MAP_VISIBLE_KEY); } catch (err) {}
  if (state.mapVisible && map) {
    requestAnimationFrame(function () {
      setTimeout(function () { if (map) map.invalidateSize(); }, 80);
      setTimeout(function () { if (map) map.invalidateSize(); }, 280);
    });
  }
}

function toggleMapVisibility() {
  applyMapVisibility(!state.mapVisible);
}

function ensureMapVisible() {
  if (!state.mapVisible) applyMapVisibility(true);
}

/* ---------- Map ---------- */
function initMap() {
  map = L.map("map", { zoomControl: true }).setView(ISRAEL_CENTER, ISRAEL_ZOOM);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  map.on("click", function (e) {
    if (!state.placingId) return;
    const c = state.customers.find(function (x) { return x.id === state.placingId; });
    if (!c) { exitPlaceMode(); return; }
    c.lat = e.latlng.lat;
    c.lng = e.latlng.lng;
    c.updatedAt = Date.now();
    c.updatedBy = currentEmail();
    persistCustomer(c);
    exitPlaceMode();
    selectCustomer(c.id, { fromMap: false, openPopup: true });
    renderAll();
    toast("המיקום עודכן");
  });

  mapReady = true;
  renderMarkers();
  setTimeout(function () { map.invalidateSize(); }, 80);
}

function markerIcon(colorId, selected) {
  const hex = colorById(colorId).hex;
  const cls = "marker-dot" + (selected ? " selected" : "");
  const size = selected ? 20 : 16;
  return L.divIcon({
    className: "cust-marker",
    html: '<div class="' + cls + '" style="background:' + hex + '"></div>',
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -size / 2]
  });
}

function popupHtml(c) {
  const parts = ['<div class="popup-title">' + escapeHtml(c.name) + "</div>"];
  if (c.address) parts.push('<div class="popup-line">' + escapeHtml(c.address) + "</div>");
  if (c.phone) {
    const href = phoneHref(c.phone);
    if (href) {
      parts.push('<div class="popup-line"><a class="popup-phone" href="' + href + '" dir="ltr">' + escapeHtml(c.phone) + "</a></div>");
    } else {
      parts.push('<div class="popup-line">' + escapeHtml(c.phone) + "</div>");
    }
  }
  if (c.notes) parts.push('<div class="popup-line">' + escapeHtml(c.notes) + "</div>");
  if (c.lat == null || c.lng == null) {
    parts.push('<div class="popup-line">אין מיקום על המפה עדיין</div>');
  }
  const actions = ['<div class="popup-actions">'];
  if (c.lat != null && c.lng != null) {
    const waze = "https://waze.com/ul?ll=" + c.lat + "," + c.lng + "&navigate=yes";
    actions.push('<a class="btn btn-sm btn-primary" href="' + waze + '" target="_blank" rel="noopener">Waze</a>');
  }
  actions.push('<button class="btn btn-sm" type="button" data-details="' + escapeHtml(c.id) + '">פרטים</button>');
  actions.push('<button class="btn btn-sm" type="button" data-edit="' + escapeHtml(c.id) + '">עריכה</button>');
  actions.push("</div>");
  parts.push(actions.join(""));
  return parts.join("");
}

function upsertMarker(c) {
  if (c.lat == null || c.lng == null) {
    if (markers[c.id]) {
      map.removeLayer(markers[c.id]);
      delete markers[c.id];
    }
    return;
  }
  const selected = state.selectedId === c.id;
  if (markers[c.id]) {
    markers[c.id].setLatLng([c.lat, c.lng]);
    markers[c.id].setIcon(markerIcon(c.color, selected));
    markers[c.id].setPopupContent(popupHtml(c));
  } else {
    const m = L.marker([c.lat, c.lng], {
      icon: markerIcon(c.color, selected),
      draggable: true,
      riseOnHover: true
    });
    m.bindPopup(popupHtml(c));
    m.on("click", function () {
      selectCustomer(c.id, { fromMap: true, openPopup: true });
    });
    m.on("dragend", function (ev) {
      const pos = ev.target.getLatLng();
      const live = state.customers.find(function (x) { return x.id === c.id; });
      if (!live) return;
      live.lat = pos.lat;
      live.lng = pos.lng;
      live.updatedAt = Date.now();
      live.updatedBy = currentEmail();
      persistCustomer(live);
      renderList();
      toast("המיקום עודכן בגרירת הסמן");
    });
    m.on("popupopen", function () {
      const root = m.getPopup().getElement();
      if (!root) return;
      const editBtn = root.querySelector("[data-edit]");
      if (editBtn) {
        editBtn.addEventListener("click", function () { openForm(c.id); });
      }
      const detailsBtn = root.querySelector("[data-details]");
      if (detailsBtn) {
        detailsBtn.addEventListener("click", function () { openDetails(c.id); });
      }
    });
    m.addTo(map);
    markers[c.id] = m;
  }
}

function renderMarkers() {
  if (!map) return;
  const ids = new Set(state.customers.map(function (c) { return c.id; }));
  Object.keys(markers).forEach(function (id) {
    if (!ids.has(id)) {
      map.removeLayer(markers[id]);
      delete markers[id];
    }
  });
  const hidden = new Set(state.hiddenColors);
  const q = state.search.trim().toLowerCase();
  state.customers.forEach(function (c) {
    const hideColor = hidden.has(c.color);
    const hideSearch = q && [c.name, c.address, c.phone, c.notes].join(" ").toLowerCase().indexOf(q) === -1;
    if (hideColor || hideSearch) {
      if (markers[c.id]) {
        map.removeLayer(markers[c.id]);
        delete markers[c.id];
      }
      return;
    }
    upsertMarker(c);
  });
}

function enterPlaceMode(id, message) {
  state.placingId = id;
  ensureMapVisible();
  const hint = $("mapHint");
  hint.textContent = message || "לחץ על המפה כדי לסמן את מיקום הלקוח";
  hint.classList.add("visible");
  if (map) map.getContainer().style.cursor = "crosshair";
  renderList();
}

function exitPlaceMode() {
  state.placingId = null;
  $("mapHint").classList.remove("visible");
  if (map) map.getContainer().style.cursor = "";
}

/* ---------- List & filters ---------- */
function renderColorFilters() {
  const wrap = $("colorFilters");
  wrap.innerHTML = "";
  COLORS.forEach(function (c) {
    const b = document.createElement("button");
    b.type = "button";
    const on = state.hiddenColors.indexOf(c.id) === -1;
    b.className = "color-chip" + (on ? " active" : "");
    b.style.background = "";
    const dot = document.createElement("i");
    dot.className = "chip-dot";
    dot.style.background = c.hex;
    b.appendChild(dot);
    b.appendChild(document.createTextNode(state.legend[c.id] || c.label));
    b.title = (state.legend[c.id] || c.label) + " — לחץ להצגה/הסתרה";
    b.setAttribute("aria-pressed", state.hiddenColors.indexOf(c.id) === -1 ? "true" : "false");
    b.addEventListener("click", function () {
      const i = state.hiddenColors.indexOf(c.id);
      if (i === -1) state.hiddenColors.push(c.id);
      else state.hiddenColors.splice(i, 1);
      resetListWindow();
      renderAll();
    });
    wrap.appendChild(b);
  });
}

function renderLegend() {
  const grid = $("legendGrid");
  grid.innerHTML = "";
  COLORS.forEach(function (c) {
    const row = document.createElement("div");
    row.className = "legend-row";
    const sw = document.createElement("span");
    sw.className = "legend-swatch";
    sw.style.background = c.hex;
    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 40;
    input.placeholder = "משמעות הצבע (" + c.label + ")";
    input.value = state.legend[c.id] || "";
    input.addEventListener("change", function () {
      const v = input.value.trim();
      if (v) state.legend[c.id] = v;
      else delete state.legend[c.id];
      persistLegend();
      renderColorFilters();
    });
    row.appendChild(sw);
    row.appendChild(input);
    grid.appendChild(row);
  });
}

function resetListWindow() {
  state.listRenderLimit = LIST_PAGE_SIZE;
}

function describeCustomerCount(shown, matched, total) {
  const totalLabel = total === 1 ? "לקוח אחד" : (total + " לקוחות");
  if (total === 0) return "אין לקוחות";
  if (matched < total && shown < matched) {
    return "מוצגים " + shown + " מתוך " + matched + " תוצאות (סה״כ " + total + ")";
  }
  if (matched < total) {
    return "נמצאו " + matched + " מתוך " + totalLabel;
  }
  if (shown < matched) {
    return "מוצגים " + shown + " מתוך " + totalLabel;
  }
  return totalLabel;
}

function updateCustomerCount(shown, matched, total) {
  const el = $("customerCount");
  if (!el) return;
  el.innerHTML = '<span class="count-num">' + escapeHtml(describeCustomerCount(shown, matched, total)) + "</span>";
}

function loadMoreCustomers() {
  state.listRenderLimit += LIST_PAGE_SIZE;
  renderList();
}

function renderList() {
  const list = $("customerList");
  const items = visibleCustomers();
  const scrollTop = list.scrollTop;
  if (state.selectedId) {
    const idx = items.findIndex(function (c) { return c.id === state.selectedId; });
    if (idx >= state.listRenderLimit) state.listRenderLimit = idx + 1;
  }
  if (state.detailsId) {
    const didx = items.findIndex(function (c) { return c.id === state.detailsId; });
    if (didx >= state.listRenderLimit) state.listRenderLimit = didx + 1;
  }
  const shownItems = items.slice(0, state.listRenderLimit);
  list.innerHTML = "";
  if (!state.customers.length) {
    list.innerHTML = '<div class="empty-state">אין לקוחות עדיין.<br/>לחץ על «לקוח חדש» כדי להוסיף, או טען לקוחות הדגמה.</div>';
  } else if (!items.length) {
    list.innerHTML = '<div class="empty-state">אין לקוחות שתואמים לחיפוש או לסינון הצבעים.</div>';
  } else {
    shownItems.forEach(function (c) {
      const row = document.createElement("div");
      row.className = "customer-row";
      row.dataset.id = c.id;
      row.setAttribute("role", "button");
      row.tabIndex = 0;
      if (state.selectedId === c.id) row.classList.add("selected");
      if (state.placingId === c.id) row.classList.add("placing");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "row-check";
      check.checked = state.routeIds.indexOf(c.id) !== -1;
      check.title = "בחר למסלול";
      check.setAttribute("aria-label", "בחר למסלול");
      check.addEventListener("click", function (e) { e.stopPropagation(); });
      check.addEventListener("change", function () {
        const i = state.routeIds.indexOf(c.id);
        if (check.checked && i === -1) state.routeIds.push(c.id);
        if (!check.checked && i !== -1) state.routeIds.splice(i, 1);
        updateSelectionCount();
      });

      const col = colorById(c.color);
      const ava = document.createElement("button");
      ava.type = "button";
      ava.className = "row-ava";
      ava.style.background = colorTint(col.hex);
      ava.style.color = col.hex;
      ava.textContent = initialOf(c.name);
      ava.title = "לחץ להחלפת צבע (" + (state.legend[c.color] || col.label) + ")";
      ava.addEventListener("click", function (e) {
        e.stopPropagation();
        c.color = nextColorId(c.color);
        c.updatedAt = Date.now();
        c.updatedBy = currentEmail();
        persistCustomer(c);
        renderAll();
      });

      const main = document.createElement("div");
      main.className = "row-main";
      const name = document.createElement("div");
      name.className = "row-name";
      name.textContent = c.name;
      const addr = document.createElement("div");
      addr.className = "row-addr";
      const addrText = document.createElement("span");
      addrText.textContent = c.address || "אין כתובת";
      addr.appendChild(addrText);
      const tag = document.createElement("span");
      tag.className = "row-tag";
      tag.style.background = colorTint(col.hex);
      tag.style.color = col.hex;
      tag.textContent = state.legend[c.color] || col.label;
      addr.appendChild(tag);
      main.appendChild(name);
      main.appendChild(addr);
      if (c.lat == null || c.lng == null) {
        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.textContent = state.placingId === c.id ? "ממתין ללחיצה על המפה…" : "אין מיקום על המפה";
        main.appendChild(meta);
      }

      const actions = document.createElement("div");
      actions.className = "row-actions";
      const tel = c.phone ? phoneHref(c.phone) : "";
      if (tel) {
        const call = document.createElement("a");
        call.className = "call-btn";
        call.href = tel;
        call.setAttribute("aria-label", "חיוג אל " + c.name);
        call.innerHTML = PHONE_ICON;
        call.addEventListener("click", function (e) { e.stopPropagation(); });
        actions.appendChild(call);
      }
      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "btn btn-sm";
      editBtn.textContent = "עריכה";
      editBtn.addEventListener("click", function (e) { e.stopPropagation(); openForm(c.id); });
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "btn btn-sm btn-danger";
      delBtn.textContent = "מחיקה";
      delBtn.addEventListener("click", function (e) { e.stopPropagation(); deleteCustomer(c.id); });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      row.appendChild(check);
      row.appendChild(ava);
      row.appendChild(main);
      row.appendChild(actions);
      row.addEventListener("click", function () {
        selectCustomer(c.id, { fromMap: false, openPopup: c.lat != null });
        openDetails(c.id);
      });
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          row.click();
        }
      });
      list.appendChild(row);
    });
    if (shownItems.length < items.length) {
      const wrap = document.createElement("div");
      wrap.className = "load-more-wrap";
      const more = document.createElement("button");
      more.type = "button";
      more.className = "btn";
      more.textContent = "טען עוד (" + (items.length - shownItems.length) + " נוספים)";
      more.addEventListener("click", loadMoreCustomers);
      wrap.appendChild(more);
      list.appendChild(wrap);
    }
  }
  updateCustomerCount(shownItems.length, items.length, state.customers.length);
  updateSelectionCount();
  list.scrollTop = scrollTop;
}

function renderFeed() {
  const wrap = $("activityFeed");
  if (!wrap) return;
  const items = state.customers.slice().sort(function (a, b) {
    const au = a.updatedAt || a.createdAt || 0;
    const bu = b.updatedAt || b.createdAt || 0;
    if (au !== bu) return bu - au;
    return String(a.name || "").localeCompare(String(b.name || ""), "he");
  }).slice(0, FEED_LIMIT);

  wrap.innerHTML = "";
  const head = document.createElement("div");
  head.className = "feed-head";
  const title = document.createElement("div");
  title.className = "feed-title";
  title.textContent = "עדכונים אחרונים";
  const sub = document.createElement("div");
  sub.className = "feed-sub";
  sub.textContent = items.length ? (items.length === 1 ? "פעילות אחת" : items.length + " פעילויות") : "";
  head.appendChild(title);
  head.appendChild(sub);
  wrap.appendChild(head);

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "feed-empty";
    empty.innerHTML = '<div class="feed-empty-title">אין עדכונים עדיין</div>' +
      '<div class="feed-empty-sub">כשתשמרו לקוח חדש או תעדכנו לקוח קיים, הפעילות האחרונה תופיע כאן.</div>';
    wrap.appendChild(empty);
    return;
  }

  const track = document.createElement("div");
  track.className = "feed-track";
  items.forEach(function (c) {
    const card = document.createElement("button");
    card.type = "button";
    const fresh = (Date.now() - (c.updatedAt || c.createdAt || 0)) < 24 * 3600 * 1000;
    card.className = "story-card" + (fresh ? " fresh" : "");
    card.title = c.name;
    const ring = document.createElement("div");
    ring.className = "story-ring";
    const av = document.createElement("div");
    av.className = "story-avatar";
    av.style.background = colorById(c.color).hex;
    av.textContent = initialOf(c.name);
    ring.appendChild(av);
    const nm = document.createElement("span");
    nm.className = "story-name";
    nm.textContent = c.name;
    const dt = document.createElement("span");
    dt.className = "story-date";
    dt.textContent = formatHebrewDate(c.updatedAt || c.createdAt) || "ללא תאריך";
    card.appendChild(ring);
    card.appendChild(nm);
    card.appendChild(dt);
    card.addEventListener("click", function () {
      selectCustomer(c.id, { fromMap: false, openPopup: c.lat != null });
      openDetails(c.id);
    });
    track.appendChild(card);
  });
  wrap.appendChild(track);
}

function updateSelectionCount() {
  const n = state.routeIds.filter(function (id) {
    return state.customers.some(function (c) { return c.id === id && c.lat != null; });
  }).length;
  $("selectionCount").textContent = n === 1 ? "לקוח אחד נבחר למסלול" : (n + " לקוחות נבחרו למסלול");
}

function renderAll() {
  renderColorFilters();
  renderFeed();
  renderList();
  renderMarkers();
  if (state.detailsId) refreshDetails();
}

function selectCustomer(id, opts) {
  opts = opts || {};
  state.selectedId = id;
  renderList();
  renderMarkers();
  const row = document.querySelector('.customer-row[data-id="' + CSS.escape(id) + '"]');
  if (row && opts.fromMap) {
    row.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  const c = state.customers.find(function (x) { return x.id === id; });
  const marker = markers[id];
  if (c && c.lat != null && map && state.mapVisible && !opts.fromMap) {
    map.flyTo([c.lat, c.lng], Math.max(map.getZoom(), 13), { duration: 0.6 });
  }
  if (marker && opts.openPopup && state.mapVisible) {
    marker.openPopup();
  }
  if (row && !opts.fromMap) {
    row.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

/* ---------- Customer details ---------- */
function closeDetails() {
  state.detailsId = null;
  const backdrop = $("detailsBackdrop");
  if (backdrop) backdrop.classList.remove("open");
}

function refreshDetails() {
  if (!state.detailsId) return;
  const c = state.customers.find(function (x) { return x.id === state.detailsId; });
  if (!c) {
    closeDetails();
    return;
  }
  fillDetails(c);
}

function fillDetails(c) {
  $("detailsTitle").textContent = c.name || "פרטי לקוח";
  const body = $("detailsBody");
  body.innerHTML = "";

  function addRow(label, nodeOrText, muted) {
    const row = document.createElement("div");
    row.className = "detail-row";
    const lab = document.createElement("div");
    lab.className = "detail-label";
    lab.textContent = label;
    const val = document.createElement("div");
    val.className = "detail-value" + (muted ? " muted" : "");
    if (typeof nodeOrText === "string") val.textContent = nodeOrText;
    else if (nodeOrText) val.appendChild(nodeOrText);
    row.appendChild(lab);
    row.appendChild(val);
    body.appendChild(row);
  }

  addRow("שם", c.name || "—", !c.name);
  addRow("כתובת", c.address || "לא הוזנה כתובת", !c.address);

  if (c.phone) {
    const href = phoneHref(c.phone);
    if (href) {
      const a = document.createElement("a");
      a.className = "detail-phone";
      a.href = href;
      a.textContent = c.phone;
      a.dir = "ltr";
      addRow("טלפון", a, false);
    } else {
      addRow("טלפון", c.phone, false);
    }
  } else {
    addRow("טלפון", "לא הוזן מספר טלפון", true);
  }

  addRow("תיאור", c.notes || "אין תיאור", !c.notes);

  const colorWrap = document.createElement("div");
  colorWrap.className = "detail-color";
  const sw = document.createElement("span");
  sw.className = "detail-swatch";
  sw.style.background = colorById(c.color).hex;
  const colorName = document.createElement("span");
  colorName.textContent = state.legend[c.color] || colorById(c.color).label;
  colorWrap.appendChild(sw);
  colorWrap.appendChild(colorName);
  addRow("צבע תיוג", colorWrap, false);

  if (c.lat != null && c.lng != null) {
    const coords = document.createElement("div");
    coords.dir = "ltr";
    coords.style.unicodeBidi = "isolate";
    coords.textContent = Number(c.lat).toFixed(5) + ", " + Number(c.lng).toFixed(5);
    addRow("מיקום במפה", coords, false);
  } else {
    addRow("מיקום במפה", "אין מיקום עדיין — אפשר לסמן על המפה", true);
  }

  addRow("נוצר", formatHebrewDate(c.createdAt) || "לא ידוע", !c.createdAt);
  addRow("עודכן לאחרונה", formatHebrewDate(c.updatedAt) || "לא ידוע", !c.updatedAt);
  if (c.updatedBy) addRow("עודכן על ידי", c.updatedBy, false);

  const actions = $("detailsActions");
  actions.innerHTML = "";

  const editBtn = document.createElement("button");
  editBtn.type = "button";
  editBtn.className = "btn btn-primary";
  editBtn.textContent = "עריכה";
  editBtn.addEventListener("click", function () {
    const id = c.id;
    closeDetails();
    openForm(id);
  });
  actions.appendChild(editBtn);

  if (c.phone && phoneHref(c.phone)) {
    const call = document.createElement("a");
    call.className = "btn";
    call.href = phoneHref(c.phone);
    call.textContent = "התקשר";
    actions.appendChild(call);
  }

  if (c.lat != null && c.lng != null) {
    const waze = document.createElement("a");
    waze.className = "btn";
    waze.href = "https://waze.com/ul?ll=" + c.lat + "," + c.lng + "&navigate=yes";
    waze.target = "_blank";
    waze.rel = "noopener";
    waze.textContent = "Waze";
    actions.appendChild(waze);
  } else {
    const placeBtn = document.createElement("button");
    placeBtn.type = "button";
    placeBtn.className = "btn";
    placeBtn.textContent = "סמן על המפה";
    placeBtn.addEventListener("click", function () {
      const id = c.id;
      closeDetails();
      selectCustomer(id, { fromMap: false, openPopup: false });
      enterPlaceMode(id);
    });
    actions.appendChild(placeBtn);
  }

  const delBtn = document.createElement("button");
  delBtn.type = "button";
  delBtn.className = "btn btn-danger";
  delBtn.textContent = "מחיקה";
  delBtn.addEventListener("click", function () { deleteCustomer(c.id); });
  actions.appendChild(delBtn);
}

function openDetails(id) {
  const c = state.customers.find(function (x) { return x.id === id; });
  if (!c) return;
  state.detailsId = id;
  fillDetails(c);
  const sheet = $("detailsSheet");
  if (sheet) { sheet.style.transform = ""; sheet.style.transition = ""; }
  $("detailsBackdrop").classList.add("open");
}

/* ---------- CRUD ---------- */
function openForm(id) {
  const modal = $("modalBackdrop");
  const c = id ? state.customers.find(function (x) { return x.id === id; }) : null;
  $("modalTitle").textContent = c ? "עריכת לקוח" : "לקוח חדש";
  $("fieldId").value = c ? c.id : "";
  $("fieldName").value = c ? c.name : "";
  $("fieldAddress").value = c ? c.address : "";
  $("fieldPhone").value = c ? (c.phone || "") : "";

function closeForm() {
  $("modalBackdrop").classList.remove("open");
  clearTimeout(geoTimer);
  geoToken += 1;
  clearPreviewMarker();
  setGeoStatus("");
  clearGeoResults();
}

function renderFormColors() {
  const wrap = $("formColors");
  wrap.innerHTML = "";
  COLORS.forEach(function (c) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "color-option" + (state.formColor === c.id ? " chosen" : "");
    b.style.background = c.hex;
    b.title = state.legend[c.id] || c.label;
    b.addEventListener("click", function () {
      state.formColor = c.id;
      renderFormColors();
    });
    wrap.appendChild(b);
  });
}

function geoCacheKey(q) {
  return String(q || "").trim().toLowerCase();
}

function normalizeGeoResults(data) {
  if (!data || !data.length) return [];
  return data.map(function (item) {
    return {
      lat: parseFloat(item.lat),
      lng: parseFloat(item.lon),
      display: item.display_name || ""
    };
  }).filter(function (item) { return isFinite(item.lat) && isFinite(item.lng); });
}

async function geocodeResults(q) {
  const query = String(q || "").trim();
  if (!query) return [];
  const key = geoCacheKey(query);
  if (Object.prototype.hasOwnProperty.call(geoCache, key)) return geoCache[key];
  const wait = NOMINATIM_GAP_MS - (Date.now() - lastNominatimAt);
  if (wait > 0) await new Promise(function (r) { setTimeout(r, wait); });
  lastNominatimAt = Date.now();
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=" + GEO_LIMIT + "&countrycodes=il&q=" + encodeURIComponent(query);
  const res = await fetch(url, {
    headers: { "Accept": "application/json", "Accept-Language": "he" }
  });
  if (!res.ok) throw new Error("geocode HTTP " + res.status);
  const results = normalizeGeoResults(await res.json());
  geoCache[key] = results;
  return results;
}

async function geocodeAddress(q) {
  const results = await geocodeResults(q);
  return results.length ? results[0] : null;
}

function setGeoStatus(text, tone) {
  const el = $("geoStatus");
  if (!el) return;
  if (!text) {
    el.hidden = true;
    el.textContent = "";
    el.className = "geo-status";
    return;
  }
  el.hidden = false;
  el.textContent = text;
  el.className = "geo-status" + (tone ? " " + tone : "");
}

function clearGeoResults() {
  const el = $("geoResults");
  if (!el) return;
  el.hidden = true;
  el.innerHTML = "";
}

function clearPreviewMarker() {
  if (previewMarker && map) {
    map.removeLayer(previewMarker);
  }
  previewMarker = null;
}

function showPreviewMarker(lat, lng) {
  if (lat == null || lng == null || !isFinite(lat) || !isFinite(lng)) return;
  ensureMapVisible();
  if (!mapReady) initMap();
  if (!map) return;
  if (previewMarker) previewMarker.setLatLng([lat, lng]);
  else {
    previewMarker = L.circleMarker([lat, lng], {
      radius: 10,
      color: "#0F766E",
      weight: 3,
      fillColor: "#5EEAD4",
      fillOpacity: 0.9
    }).addTo(map);
  }
  const z = Math.max(map.getZoom ? map.getZoom() : 8, 15);
  map.setView([lat, lng], z, { animate: true });
  setTimeout(function () { if (map) map.invalidateSize(); }, 80);
}

function chooseGeoResult(item, address) {
  if (!item) return;
  formGeo.selected = item;
  formGeo.addressQueried = address;
  formGeo.manualOverride = false;
  formGeo.status = "found";
  setGeoStatus("נמצא" + (item.display ? (" — " + item.display) : ""), "ok");
  ensureMapVisible();
  showPreviewMarker(item.lat, item.lng);
  const box = $("geoResults");
  if (box) {
    Array.prototype.forEach.call(box.querySelectorAll(".geo-option"), function (btn) {
      btn.setAttribute("aria-selected", btn.getAttribute("data-lat") === String(item.lat) && btn.getAttribute("data-lng") === String(item.lng) ? "true" : "false");
    });
  }
}

function renderGeoPickList(results, address) {
  const box = $("geoResults");
  if (!box) return;
  box.innerHTML = "";
  if (!results || results.length < 2) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  results.forEach(function (item, i) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "geo-option";
    btn.textContent = item.display || ("תוצאה " + (i + 1));
    btn.setAttribute("data-lat", String(item.lat));
    btn.setAttribute("data-lng", String(item.lng));
    if (formGeo.selected && formGeo.selected.lat === item.lat && formGeo.selected.lng === item.lng) {
      btn.setAttribute("aria-selected", "true");
    }
    btn.addEventListener("click", function () { chooseGeoResult(item, address); });
    box.appendChild(btn);
  });
}

function resetFormGeo(existing) {
  clearTimeout(geoTimer);
  geoTimer = null;
  geoToken += 1;
  formGeo = {
    status: "idle",
    results: [],
    selected: existing && existing.lat != null ? { lat: existing.lat, lng: existing.lng, display: "" } : null,
    addressQueried: existing ? (existing.address || "") : "",
    manualOverride: false,
    originalAddress: existing ? (existing.address || "") : "",
    originalCoords: existing && existing.lat != null ? { lat: existing.lat, lng: existing.lng } : null
  };
  setGeoStatus("");
  clearGeoResults();
  clearPreviewMarker();
}

async function autoGeocodeAddress(raw, opts) {
  opts = opts || {};
  const query = String(raw || "").trim();
  if (!query || query.length < GEO_MIN_CHARS) {
    if (!query) {
      setGeoStatus("");
      clearGeoResults();
    }
    return;
  }
  if (formGeo.originalCoords && query === formGeo.originalAddress) {
    formGeo.selected = formGeo.originalCoords;
    formGeo.addressQueried = query;
    formGeo.manualOverride = false;
    formGeo.status = "idle";
    setGeoStatus("");
    clearGeoResults();
    clearPreviewMarker();
    return;
  }
  if (formGeo.manualOverride && query === formGeo.addressQueried) return;
  if (formGeo.status === "found" && query === formGeo.addressQueried && formGeo.selected) return;

  const token = ++geoToken;
  formGeo.status = "loading";
  setGeoStatus("מאתר כתובת…", "busy");
  try {
    const results = await geocodeResults(query);
    if (token !== geoToken) return;
    if ($("fieldAddress") && $("fieldAddress").value.trim() !== query) return;
    formGeo.results = results;
    formGeo.addressQueried = query;
    if (!results.length) {
      formGeo.status = "notfound";
      formGeo.selected = formGeo.originalCoords;
      setGeoStatus("לא נמצא — אפשר לסמן ידנית", "warn");
      clearGeoResults();
      return;
    }
    formGeo.status = "found";
    chooseGeoResult(results[0], query);
    renderGeoPickList(results, query);
    if (results.length > 1) {
      setGeoStatus("נמצאו " + results.length + " תוצאות — בחרו את המתאימה, או סמנו ידנית", "ok");
    }
  } catch (err) {
    if (token !== geoToken) return;
    console.warn("auto geocode failed", err);
    formGeo.status = "error";
    setGeoStatus("לא ניתן לאתר כרגע — אפשר לסמן ידנית", "warn");
  }
}

function scheduleAutoGeocode() {
  clearTimeout(geoTimer);
  const query = $("fieldAddress") ? $("fieldAddress").value.trim() : "";
  if (formGeo.originalCoords && query === formGeo.originalAddress) {
    autoGeocodeAddress(query, { reason: "restore" });
    return;
  }
  geoTimer = setTimeout(function () {
    autoGeocodeAddress(query, { reason: "debounce" });
  }, GEO_DEBOUNCE_MS);
}

function resolveFormCoords(fields, existing) {
  const addressChanged = !existing || (existing.address || "") !== fields.address;
  if (formGeo.selected && formGeo.addressQueried === fields.address && formGeo.status === "found") {
    return formGeo.selected;
  }
  if (!addressChanged && existing && existing.lat != null) {
    return { lat: existing.lat, lng: existing.lng };
  }
  if (formGeo.manualOverride && !addressChanged && existing && existing.lat != null) {
    return { lat: existing.lat, lng: existing.lng };
  }
  if (formGeo.selected && !addressChanged) return formGeo.selected;
  return null;
}

function collectForm() {
  return {
    id: $("fieldId").value || uid(),
    name: $("fieldName").value.trim(),
    address: $("fieldAddress").value.trim(),
    phone: $("fieldPhone").value.trim(),
    notes: $("fieldNotes").value.trim(),
    color: state.formColor
  };
}

function upsertCustomerRecord(fields, coords) {
  const existing = state.customers.find(function (x) { return x.id === fields.id; });
  if (existing) {
    existing.name = fields.name;
    existing.address = fields.address;
    existing.phone = fields.phone;
    existing.notes = fields.notes;
    existing.color = fields.color;
    existing.updatedAt = Date.now();
    existing.updatedBy = currentEmail();
    if (coords) {
      existing.lat = coords.lat;
      existing.lng = coords.lng;
    }
    return existing;
  }
  const rec = {
    id: fields.id,
    name: fields.name,
    address: fields.address,
    phone: fields.phone,
    notes: fields.notes,
    color: fields.color,
    lat: coords ? coords.lat : null,
    lng: coords ? coords.lng : null,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    updatedBy: currentEmail()
  };
  state.customers.unshift(rec);
  return rec;
}

async function onFormSubmit(ev) {
  ev.preventDefault();
  const fields = collectForm();
  const status = $("formStatus");
  status.classList.remove("error");
  if (!fields.name) {
    status.textContent = "יש למלא שם לקוח";
    status.classList.add("error");
    return;
  }
  const existing = state.customers.find(function (x) { return x.id === fields.id; });
  const addressChanged = !existing || (existing.address || "") !== fields.address;
  const already = resolveFormCoords(fields, existing);
  const keepExisting = existing && existing.lat != null && !addressChanged;
  const needsGeocode = fields.address && !already && !keepExisting && (!existing || addressChanged || existing.lat == null);

  if (already) {
    const rec = upsertCustomerRecord(fields, already);
    persistCustomer(rec);
    closeForm();
    renderAll();
    if (rec.lat != null) selectCustomer(rec.id, { fromMap: false, openPopup: true });
    else enterPlaceMode(rec.id);
    toast(already.display ? "הלקוח נשמר והכתובת אותרה" : "הלקוח נשמר");
    return;
  }

  if (needsGeocode) {
    status.textContent = "מחפש כתובת…";
    $("btnSave").disabled = true;
    try {
      const result = await geocodeAddress(fields.address);
      $("btnSave").disabled = false;
      if (result) {
        const rec = upsertCustomerRecord(fields, result);
        persistCustomer(rec);
        closeForm();
        renderAll();
        selectCustomer(rec.id, { fromMap: false, openPopup: true });
        toast("הלקוח נשמר והכתובת אותרה");
        return;
      }
      const rec = upsertCustomerRecord(fields, null);
      persistCustomer(rec);
      closeForm();
      renderAll();
      selectCustomer(rec.id, { fromMap: false, openPopup: false });
      enterPlaceMode(rec.id, "הכתובת לא נמצאה. לחץ על המפה כדי לסמן את המיקום");
      toast("הכתובת לא נמצאה — סמן ידנית על המפה");
    } catch (err) {
      $("btnSave").disabled = false;
      const rec = upsertCustomerRecord(fields, existing && existing.lat != null ? { lat: existing.lat, lng: existing.lng } : null);
      persistCustomer(rec);
      closeForm();
      renderAll();
      selectCustomer(rec.id, { fromMap: false, openPopup: false });
      if (rec.lat == null) {
        enterPlaceMode(rec.id, "לא ניתן היה לאתר את הכתובת. לחץ על המפה כדי לסמן את המיקום");
      }
      toast("חיפוש הכתובת נכשל — אפשר לסמן ידנית על המפה");
      console.warn(err);
    }
    return;
  }

  const rec = upsertCustomerRecord(fields, existing && existing.lat != null ? { lat: existing.lat, lng: existing.lng } : null);
  persistCustomer(rec);
  closeForm();
  renderAll();
  if (rec.lat != null) selectCustomer(rec.id, { fromMap: false, openPopup: true });
  else enterPlaceMode(rec.id);
  toast("הלקוח נשמר");
}

function onManualPlace() {
  const fields = collectForm();
  if (!fields.name) {
    $("formStatus").textContent = "יש למלא שם לקוח לפני הסימון על המפה";
    $("formStatus").classList.add("error");
    return;
  }
  formGeo.manualOverride = true;
  formGeo.addressQueried = fields.address;
  const existing = state.customers.find(function (x) { return x.id === fields.id; });
  const pending = resolveFormCoords(fields, existing);
  const rec = upsertCustomerRecord(fields, pending || (existing && existing.lat != null ? { lat: existing.lat, lng: existing.lng } : null));
  persistCustomer(rec);
  closeForm();
  renderAll();
  selectCustomer(rec.id, { fromMap: false, openPopup: false });
  enterPlaceMode(rec.id);
}

function deleteCustomer(id) {
  const c = state.customers.find(function (x) { return x.id === id; });
  if (!c) return;
  const ok = confirm("למחוק את הלקוח «" + c.name + "»? הפעולה אינה ניתנת לביטול.");
  if (!ok) return;
  state.customers = state.customers.filter(function (x) { return x.id !== id; });
  state.routeIds = state.routeIds.filter(function (x) { return x !== id; });
  if (state.selectedId === id) state.selectedId = null;
  if (state.placingId === id) exitPlaceMode();
  persistDelete(id);
  if (state.detailsId === id) closeDetails();
  renderAll();
  toast("הלקוח נמחק");
}

/* ---------- Import / Export / Demo ---------- */
function exportJson() {
  const payload = {
    exportedAt: new Date().toISOString(),
    customers: state.customers,
    legend: state.legend
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "customers-map-backup.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  toast("הקובץ יוצא");
}

function importJsonFile(file) {
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : data.customers;
      if (!Array.isArray(list)) throw new Error("missing customers array");
      const cleaned = list.map(function (c) {
        return normalizeCustomer(c, c && c.id);
      }).filter(Boolean);
      if (!confirm("ייבוא יחליף את רשימת הלקוחות הנוכחית (" + cleaned.length + " לקוחות בקובץ). להמשיך?")) return;
      const previousIds = state.customers.map(function (c) { return c.id; });
      state.customers = cleaned;
      if (data.legend && typeof data.legend === "object") state.legend = data.legend;
      state.routeIds = [];
      state.selectedId = null;
      exitPlaceMode();
      mirrorLocal();
      replaceAllInCloud(previousIds);
      renderAll();
      if (map) map.setView(ISRAEL_CENTER, ISRAEL_ZOOM);
      toast("הייבוא הושלם");
    } catch (err) {
      alert("לא ניתן לייבא את הקובץ. ודא שזה קובץ JSON שיוצא מהאפליקציה.");
      console.warn(err);
    }
  };
  reader.readAsText(file, "utf-8");
}

function loadDemo() {
  const have = new Set(state.customers.map(function (c) { return c.id; }));
  let added = 0;
  DEMO_CUSTOMERS.forEach(function (d) {
    if (have.has(d.id)) {
      const existing = state.customers.find(function (c) { return c.id === d.id; });
      Object.assign(existing, d, { updatedAt: Date.now(), updatedBy: currentEmail() });
      persistCustomer(existing);
    } else {
      const rec = Object.assign({ createdAt: Date.now(), updatedAt: Date.now(), updatedBy: currentEmail() }, d);
      state.customers.unshift(rec);
      persistCustomer(rec);
      added += 1;
    }
  });
  mirrorLocal();
  renderAll();
  if (map) {
    const layer = L.featureGroup(DEMO_CUSTOMERS.filter(function (d) {
      return markers[d.id];
    }).map(function (d) { return markers[d.id]; }));
    if (layer.getLayers().length) map.fitBounds(layer.getBounds().pad(0.25));
  }
  toast(added ? "נטענו " + added + " לקוחות הדגמה" : "לקוחות ההדגמה עודכנו");
}

function openGoogleRoute() {
  const stops = state.routeIds.map(function (id) {
    return state.customers.find(function (c) { return c.id === id; });
  }).filter(function (c) { return c && c.lat != null && c.lng != null; });
  if (!stops.length) {
    toast("יש לבחור לפחות לקוח אחד עם מיקום על המפה");
    return;
  }
  if (stops.length > MAX_ROUTE_STOPS) {
    alert("נבחרו " + stops.length + " עצירות, אך Google Maps מאפשר עד כ־" + MAX_ROUTE_STOPS + " עצירות בקישור אחד. יש לצמצם את הבחירה.");
    return;
  }
  const path = stops.map(function (c) { return c.lat + "," + c.lng; }).join("/");
  const url = "https://www.google.com/maps/dir/" + path;
  window.open(url, "_blank", "noopener");
}

/* ---------- Wire up ---------- */
function bind() {
  $("lockForm").addEventListener("submit", onLockSubmit);
  $("btnSignOut").addEventListener("click", onSignOut);
  $("btnAdd").addEventListener("click", function () { openForm(null); });
  $("btnFabAdd").addEventListener("click", function () { openForm(null); });
  $("btnModalClose").addEventListener("click", closeForm);
  $("btnCancelForm").addEventListener("click", closeForm);
  $("modalBackdrop").addEventListener("click", function (e) {
    if (e.target === $("modalBackdrop")) closeForm();
  });
  $("customerForm").addEventListener("submit", onFormSubmit);
  $("btnManualPlace").addEventListener("click", onManualPlace);
  $("fieldAddress").addEventListener("input", scheduleAutoGeocode);
  $("fieldAddress").addEventListener("blur", function () {
    clearTimeout(geoTimer);
    autoGeocodeAddress($("fieldAddress").value.trim(), { reason: "blur" });
  });
  $("searchInput").addEventListener("input", function () {
    state.search = $("searchInput").value;
    resetListWindow();
    renderAll();
  });
  $("btnExport").addEventListener("click", exportJson);
  $("btnImport").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    const f = $("importFile").files && $("importFile").files[0];
    $("importFile").value = "";
    if (f) importJsonFile(f);
  });
  $("btnDemo").addEventListener("click", loadDemo);
  $("btnSelectVisible").addEventListener("click", function () {
    visibleCustomers().forEach(function (c) {
      if (c.lat == null) return;
      if (state.routeIds.indexOf(c.id) === -1) state.routeIds.push(c.id);
    });
    renderList();
  });
  $("btnClearSelection").addEventListener("click", function () {
    state.routeIds = [];
    renderList();
  });
  $("btnRoute").addEventListener("click", openGoogleRoute);
  function setHeaderMenuOpen(open) {
    const menu = $("headerMenu");
    const btn = $("btnHeaderMenu");
    const nav = $("btnNavMenu");
    if (!menu) return;
    menu.hidden = !open;
    if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (nav) nav.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function onMenuToggle(e) {
    e.stopPropagation();
    setHeaderMenuOpen($("headerMenu").hidden);
  }
  $("btnHeaderMenu").addEventListener("click", onMenuToggle);
  if ($("btnNavMenu")) $("btnNavMenu").addEventListener("click", onMenuToggle);
  document.addEventListener("click", function (e) {
    const menu = $("headerMenu");
    if (!menu || menu.hidden) return;
    const wrap = document.querySelector(".header-menu-wrap");
    const nav = $("btnNavMenu");
    if (menu.contains(e.target)) return;
    if (wrap && wrap.contains(e.target)) return;
    if (nav && nav.contains(e.target)) return;
    setHeaderMenuOpen(false);
  });
  ["btnExport", "btnImport", "btnDemo", "btnSignOut", "btnToggleMapHeader"].forEach(function (id) {
    const el = $(id);
    if (el) el.addEventListener("click", function () { setHeaderMenuOpen(false); });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if ($("headerMenu") && !$("headerMenu").hidden) setHeaderMenuOpen(false);
      else if ($("modalBackdrop").classList.contains("open")) closeForm();
      else if ($("detailsBackdrop") && $("detailsBackdrop").classList.contains("open")) closeDetails();
      else if (state.placingId) { exitPlaceMode(); renderList(); }
    }
  });
  window.addEventListener("online", function () { updateSyncPill(); });
  window.addEventListener("offline", function () { updateSyncPill(); });
  window.addEventListener("resize", function () {
    if (map && state.mapVisible) map.invalidateSize();
  });

  function onToggleMap(e) {
    e.preventDefault();
    toggleMapVisibility();
  }
  $("btnToggleMap").addEventListener("click", onToggleMap);
  $("btnToggleMapHeader").addEventListener("click", onToggleMap);
  if ($("btnMapClose")) $("btnMapClose").addEventListener("click", onToggleMap);
  if ($("btnNavMap")) $("btnNavMap").addEventListener("click", onToggleMap);
  if ($("btnNavAdd")) $("btnNavAdd").addEventListener("click", function () { openForm(null); });
  if ($("btnNavList")) $("btnNavList").addEventListener("click", function () {
    if (state.mapVisible) applyMapVisibility(false);
    const list = $("customerList");
    if (list) list.scrollTop = 0;
  });

  function enableSwipeToClose(sheetEl, onClose) {
    if (!sheetEl) return;
    let startY = 0, currentY = 0, dragging = false;
    const handle = sheetEl.querySelector(".sheet-handle");
    const header = sheetEl.querySelector("header");
    function isGrip(t) {
      return (handle && (handle === t || handle.contains(t))) || (header && (header === t || header.contains(t)));
    }
    sheetEl.addEventListener("touchstart", function (e) {
      if (!e.touches || !e.touches[0] || !isGrip(e.target)) { dragging = false; return; }
      startY = e.touches[0].clientY;
      currentY = startY;
      dragging = true;
      sheetEl.style.transition = "none";
    }, { passive: true });
    sheetEl.addEventListener("touchmove", function (e) {
      if (!dragging || !e.touches || !e.touches[0]) return;
      currentY = e.touches[0].clientY;
      const dy = Math.max(0, currentY - startY);
      sheetEl.style.transform = "translateY(" + dy + "px)";
    }, { passive: true });
    function endSwipe() {
      if (!dragging) return;
      dragging = false;
      const dy = currentY - startY;
      sheetEl.style.transition = "transform 0.18s ease-out";
      if (dy > 80) {
        sheetEl.style.transform = "translateY(100%)";
        setTimeout(function () {
          sheetEl.style.transform = "";
          sheetEl.style.transition = "";
          onClose();
        }, 160);
      } else {
        sheetEl.style.transform = "";
        setTimeout(function () { sheetEl.style.transition = ""; }, 180);
      }
    }
    sheetEl.addEventListener("touchend", endSwipe);
    sheetEl.addEventListener("touchcancel", endSwipe);
  }
  enableSwipeToClose(document.querySelector("#modalBackdrop .modal"), closeForm);
  enableSwipeToClose($("detailsSheet"), closeDetails);

  $("btnDetailsClose").addEventListener("click", closeDetails);
  $("detailsBackdrop").addEventListener("click", function (e) {
    if (e.target === $("detailsBackdrop")) closeDetails();
  });

  $("customerList").addEventListener("scroll", function () {
    const list = $("customerList");
    if (list.scrollTop + list.clientHeight >= list.scrollHeight - 80) {
      const items = visibleCustomers();
      if (state.listRenderLimit < items.length) loadMoreCustomers();
    }
  });
}

window.__customersApp = {
  isFirebaseConfigured: function () { return false; },
  isLocalOnly: function () { return true; },
  storageKey: STORAGE_KEY,
  sessionKey: SESSION_KEY,
  tryUnlock: tryUnlock,
  loadDemo: loadDemo,
  getState: function () { return state; },
  renderAll: renderAll,
  openDetails: openDetails,
  setMapVisible: function (v) { applyMapVisibility(!!v); },
  geocodeAddress: geocodeAddress,
  autoGeocodeAddress: autoGeocodeAddress,
  getFormGeo: function () { return formGeo; },
  selectCustomer: selectCustomer,
  cycleColor: function (id) {
    const c = state.customers.find(function (x) { return x.id === id; });
    if (!c) return null;
    c.color = nextColorId(c.color);
    c.updatedAt = Date.now();
    c.updatedBy = currentEmail();
    persistCustomer(c);
    renderAll();
    return c.color;
  }
};
